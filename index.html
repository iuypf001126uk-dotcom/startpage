<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Page</title>
<style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;padding:48px 16px}h1{font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;max-width:640px;width:100%;margin-top:24px}a.card{background:#1e293b;color:#e2e8f0;text-decoration:none;padding:18px;border-radius:12px;text-align:center}a.card:hover{background:#334155}input{width:100%;max-width:640px;padding:12px 16px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#e2e8f0}</style>
</head>
<body>
<h1>Start Page</h1>
<form action="https://www.google.com/search" method="get"><input name="q" placeholder="Search Google"></form>
<div class="grid">
<a class="card" href="https://www.youtube.com">YouTube</a>
<a class="card" href="https://github.com">GitHub</a>
<a class="card" href="https://mail.google.com">Gmail</a>
<a class="card" href="https://x.com">X</a>
<a class="card" href="https://www.reddit.com">Reddit</a>
<a class="card" href="https://www.wikipedia.org">Wikipedia</a>
</div>
</body>
</html>
